name: Release synchronized CLI

"on":
  push:
    branches: [main]
    paths: [contract.lock.json]

permissions:
  contents: read

concurrency:
  group: api-sync-release
  cancel-in-progress: false

jobs:
  tag:
    name: Create CLI patch release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_SYNC_BOT_TOKEN: ${{ secrets.API_SYNC_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.API_SYNC_BOT_TOKEN }}
          ref: ${{ github.sha }}

      - name: Check for releasable changes
        id: release_changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --name-only HEAD^1 HEAD | grep -v -x -e spec.yaml -e contract.lock.json >/dev/null; then
            echo "has_cli_changes=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cli_changes=false" >> "${GITHUB_OUTPUT}"
            echo "The merge changed only spec.yaml and contract.lock.json; no CLI release tag was created." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Require release token
        if: steps.release_changes.outputs.has_cli_changes == 'true'
        run: |
          if [ -z "${API_SYNC_BOT_TOKEN}" ]; then
            echo "API_SYNC_BOT_TOKEN is required to create the CLI release tag." >&2
            exit 1
          fi

      - name: Resolve next patch version
        if: steps.release_changes.outputs.has_cli_changes == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail

          existing_tag="$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n 1)"
          if [ -n "${existing_tag}" ]; then
            echo "already_tagged=true" >> "${GITHUB_OUTPUT}"
            echo "tag=${existing_tag}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          [[ "${latest_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
            echo "Could not resolve the latest stable CLI version." >&2
            exit 1
          }
          next_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          echo "already_tagged=false" >> "${GITHUB_OUTPUT}"
          echo "tag=${next_tag}" >> "${GITHUB_OUTPUT}"

      - name: Create patch release tag
        if: steps.release_changes.outputs.has_cli_changes == 'true' && steps.version.outputs.already_tagged != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git tag "${RELEASE_TAG}" "${RELEASE_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"
          echo "Created ${RELEASE_TAG}; the Release workflow will publish the CLI distributions." >> "${GITHUB_STEP_SUMMARY}"

      - name: Report existing tag
        if: steps.release_changes.outputs.has_cli_changes == 'true' && steps.version.outputs.already_tagged == 'true'
        run: echo "${{ steps.version.outputs.tag }} already points at this merge; no new release tag was created." >> "${GITHUB_STEP_SUMMARY}"
